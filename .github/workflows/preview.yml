name: Deploy preview

on:
  push:
    branches: [main]
    paths-ignore: [".github/workflows/**", "README.md"]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit in willchavez/willchavez-site to preview
        required: true
        default: master
        type: string
      cancel_deployment_id:
        description: Cancel a stuck Pages deployment before publishing (optional)
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: preview-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      source-sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: willchavez/willchavez-site
          ref: ${{ inputs.source_ref || 'master' }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/app/package-lock.json
      - name: Restore responsive images
        id: images-cache
        uses: actions/cache/restore@v4
        with:
          path: source/app/.cache/responsive-images
          key: responsive-images-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('source/app/scripts/images.mjs', 'source/app/package-lock.json') }}-${{ hashFiles('source/app/public/uploads/**', 'source/img/portfolio/**') }}
          restore-keys: |
            responsive-images-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('source/app/scripts/images.mjs', 'source/app/package-lock.json') }}-
      - name: Build site
        run: sh source/app/build.sh
      - name: Check image caching
        run: node --test source/app/scripts/images.test.mjs
      - name: Save responsive images
        if: steps.images-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: source/app/.cache/responsive-images
          key: ${{ steps.images-cache.outputs.cache-primary-key }}
      - name: Prepare project Pages paths
        run: python3 scripts/prepare-preview.py source/app/dist
      - name: Record preview source
        id: source
        run: |
          SHA=$(git -C source rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Preview source: [willchavez/willchavez-site@$SHA](https://github.com/willchavez/willchavez-site/commit/$SHA)" >> "$GITHUB_STEP_SUMMARY"
          printf '{"repository":"willchavez/willchavez-site","commit":"%s"}\n' "$SHA" > source/app/dist/preview-source.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: source/app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Cancel stuck Pages deployment
        if: inputs.cancel_deployment_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_DEPLOYMENT_ID: ${{ inputs.cancel_deployment_id }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/deployments/${PAGES_DEPLOYMENT_ID}/cancel"
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify published source
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.build.outputs.source-sha }}
          PREVIEW_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in $(seq 1 12); do
            ACTUAL_SOURCE_SHA=$(curl --fail --silent --show-error --max-time 15 -H 'Cache-Control: no-cache' "${PREVIEW_URL}preview-source.json?run=${GITHUB_RUN_ID}-${attempt}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"])' || true)
            if [ "$ACTUAL_SOURCE_SHA" = "$EXPECTED_SOURCE_SHA" ]; then
              echo "Verified published source: $EXPECTED_SOURCE_SHA"
              exit 0
            fi
            echo "Waiting for published source ($attempt/12): expected $EXPECTED_SOURCE_SHA, received $ACTUAL_SOURCE_SHA"
            sleep 5
          done
          echo "::error::Pages reported success but the public preview is still serving a different source commit."
          exit 1
